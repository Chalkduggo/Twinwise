<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinwise</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <header class="top">
    <a class="logo" href="#/twin" aria-label="Twinwise home">
      <img src="/static/logo.svg" width="28" height="28" alt=""><b>Twinwise</b>
    </a>
    <div class="top-right">
      <span class="local" role="note" title="Twinwise runs on this computer. Files are never uploaded.">Processing locally</span>
      <a class="ico-btn" href="https://github.com/Chalkduggo/Twinwise#readme" target="_blank" rel="noopener" title="Help" aria-label="Help (opens the Twinwise guide on GitHub)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5M12 17h.01"/></svg>
      </a>
    </div>
  </header>
  <nav class="side" id="side" aria-label="Main"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
