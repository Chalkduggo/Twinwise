[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinwise"
version = "0.3.6"
description = "Make a safe twin of business spreadsheets before you use AI. Runs locally."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Suman Mondal"}]
requires-python = ">=3.10"
keywords = ["privacy", "data masking", "anonymization", "pseudonymization", "excel", "llm", "ai safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Security",
]
dependencies = [
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
twinwise = "twinwise.cli:main"

[project.urls]
Homepage = "https://github.com/Chalkduggo/Twinwise"
Documentation = "https://github.com/Chalkduggo/Twinwise/blob/main/docs/USER_MANUAL.md"
Changelog = "https://github.com/Chalkduggo/Twinwise/blob/main/CHANGELOG.md"
Issues = "https://github.com/Chalkduggo/Twinwise/issues"
Security = "https://github.com/Chalkduggo/Twinwise/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["twinwise", "twinwise.ui"]

[tool.setuptools.package-data]
"twinwise.ui" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
