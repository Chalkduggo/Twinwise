name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install . pyinstaller
      - name: Build Twinwise.exe
        run: >
          pyinstaller --noconfirm --onefile --name Twinwise
          --icon assets/twinwise.ico
          --add-data "twinwise/ui;twinwise/ui"
          --collect-submodules uvicorn
          --hidden-import python_multipart --hidden-import multipart
          twinwise_launcher.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\Twinwise.exe -ArgumentList "ui","--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 8
          $r = Invoke-WebRequest http://127.0.0.1:8799/api/status -UseBasicParsing
          Stop-Process -Id $p.Id
          if ($r.StatusCode -ne 200) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Twinwise-windows
          path: dist/Twinwise.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Twinwise.exe
