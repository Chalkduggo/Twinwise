name: Publish to PyPI

# Runs when you publish a release on GitHub (not for pre-releases).
# Uses PyPI "trusted publishing": no password or token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION"
      - name: Test the built package installs and runs
        run: |
          python -m venv /tmp/t && /tmp/t/bin/pip install dist/*.whl
          /tmp/t/bin/twinwise --version
      - uses: actions/upload-artifact@v5
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/twinwise
    permissions:
      id-token: write   # lets PyPI confirm this run comes from Chalkduggo/Twinwise
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
